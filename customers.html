<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Customers · Chai Chuski</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="font-sans antialiased bg-gray-100 text-gray-900 invisible">
<main class="max-w-xl mx-auto py-6 px-4">
  <div class="bg-white shadow-sm rounded-lg p-6">
    <h2 class="text-lg font-semibold mb-4">Add New Customer</h2>
    <form id="form" class="space-y-3">
      <div><label class="text-sm">Full Name</label><input id="name" required class="w-full border border-gray-300 rounded-md px-3 py-2"></div>
      <div><label class="text-sm">Phone Number</label><input id="phone" placeholder="03XXXXXXXXX" class="w-full border border-gray-300 rounded-md px-3 py-2"></div>
      <div><label class="text-sm">Email (Optional)</label><input id="email" type="email" class="w-full border border-gray-300 rounded-md px-3 py-2"></div>
      <button class="w-full bg-blue-600 text-white rounded-md py-2">Save Customer</button>
    </form>
    <div class="mt-6 border border-gray-100 rounded-lg p-4">
      <h3 class="text-lg font-semibold mb-3">Customer Directory &amp; Balances</h3>
      <input type="text" id="filter" placeholder="Search..." class="w-full border border-gray-300 rounded-md px-3 py-1.5 mb-3 text-sm">
      <table class="w-full text-sm">
        <thead class="bg-gray-50"><tr><th class="p-2 text-left">Name</th><th class="p-2">Total Orders</th><th class="p-2">Pending Debt (PKR)</th><th class="p-2">Actions</th></tr></thead>
        <tbody id="body"><tr><td class="p-3 text-gray-500" colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script type="module">
import { db, requireAuth, $, esc, num, toast, nowTs } from "./js/app.js";
import { collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let customers = [];
requireAuth(load);

async function load() {
  const [cs, unpaid] = await Promise.all([
    getDocs(collection(db, "customers")),
    getDocs(query(collection(db, "orders"), where("isPaid", "==", false)))
  ]);
  const debt = {};
  unpaid.docs.forEach((d) => { const o = d.data(); if (o.status !== "cancelled" && o.customerId) debt[o.customerId] = (debt[o.customerId] || 0) + num(o.total); });
  customers = cs.docs.map((d) => ({ id: d.id, ...d.data(), debt: debt[d.id] || 0 })).sort((a, b) => num(a.createdAt?.seconds) - num(b.createdAt?.seconds));
  render();
}
function render() {
  const v = $("filter").value.toLowerCase();
  const list = customers.filter((c) => !v || (c.name + " " + (c.phone || "")).toLowerCase().includes(v));
  $("body").innerHTML = list.map((c) => `<tr class="border-t">
    <td class="p-2"><div class="font-medium">${esc(c.name)}</div><div class="text-xs text-gray-500">${esc(c.phone)}</div></td>
    <td class="p-2 text-center">${num(c.orderCount)}</td>
    <td class="p-2 text-center ${c.debt > 0 ? "text-red-600 font-semibold" : "text-green-600"}">${c.debt.toFixed(2)}</td>
    <td class="p-2 text-center"><a href="customer.html?id=${c.id}" class="text-blue-600">View History</a></td></tr>`).join("")
    || `<tr><td class="p-3 text-gray-500" colspan="4">Koi customer nahi.</td></tr>`;
}
$("filter").addEventListener("input", render);
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("name").value.trim(), phone = $("phone").value.trim();
  if (phone && customers.some((c) => c.phone === phone)) return toast("Ye phone number pehle se mojood hai", "error");
  await addDoc(collection(db, "customers"), { name, phone: phone || null, email: $("email").value.trim() || null, orderCount: 0, createdAt: nowTs() });
  toast(`Customer '${name}' save ho gaya`); e.target.reset(); load();
});
</script>
</body>
</html>
