<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Expenses · Chai Chuski</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="font-sans antialiased bg-gray-100 text-gray-900 invisible">
<main class="max-w-7xl mx-auto py-6 space-y-6">
  <div class="bg-white shadow-sm sm:rounded-lg p-6">
    <h2 class="text-lg font-semibold mb-3">Add New Category</h2>
    <form id="catForm" class="flex gap-2">
      <input id="catName" placeholder="Category Name (e.g. Rent)" required class="flex-1 border border-gray-300 rounded-md px-3 py-2">
      <button class="bg-green-600 text-white px-4 rounded-md">Add</button>
    </form>
  </div>
  <div class="bg-white shadow-sm sm:rounded-lg p-6">
    <h2 class="text-lg font-semibold mb-3">Add New Expense</h2>
    <form id="expForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <input id="amount" type="number" step="0.01" placeholder="Amount" required class="border border-gray-300 rounded-md px-3 py-2">
      <select id="category" class="border border-gray-300 rounded-md px-3 py-2"></select>
      <input id="date" type="date" class="border border-gray-300 rounded-md px-3 py-2">
      <input id="method" placeholder="Payment Method (Cash/Bank)" class="border border-gray-300 rounded-md px-3 py-2">
      <textarea id="desc" placeholder="Description" class="md:col-span-2 border border-gray-300 rounded-md px-3 py-2"></textarea>
      <button class="bg-blue-600 text-white rounded-md py-2">Save Expense</button>
    </form>
    <div class="flex items-center justify-between mt-8 mb-2">
      <h3 class="font-semibold">Recent Expenses</h3>
      <div class="flex items-center gap-2 text-sm">
        <input type="month" id="month" class="border border-gray-300 rounded px-2 py-1">
        <span class="font-semibold">Total: <span class="text-red-600" id="total">RS 0</span></span>
      </div>
    </div>
    <table class="min-w-full text-sm"><tbody id="list"></tbody></table>
  </div>
</main>
<script type="module">
import { db, requireAuth, $, esc, num, todayISO, toast, nowTs } from "./js/app.js";
import { collection, addDoc, getDocs, query, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let cats = [];
requireAuth(async () => {
  $("date").value = todayISO(); $("month").value = todayISO().slice(0, 7);
  await loadCats(); await loadList();
});

async function loadCats() {
  cats = (await getDocs(collection(db, "expenseCategories"))).docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => num(a.sort) - num(b.sort));
  $("category").innerHTML = `<option value="">Select Category</option>` + cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
}
async function loadList() {
  const m = $("month").value, from = m + "-01";
  const last = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const snap = await getDocs(query(collection(db, "expenses"), where("date", ">=", from), where("date", "<=", `${m}-${last}`)));
  const list = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.date.localeCompare(a.date) || num(b.createdAt?.seconds) - num(a.createdAt?.seconds));
  const catName = Object.fromEntries(cats.map((c) => [c.id, c.name]));
  $("total").textContent = "RS " + list.reduce((s, x) => s + num(x.amount), 0).toFixed(2);
  $("list").innerHTML = list.map((x) => `<tr class="border-t">
    <td class="py-2 pe-4 whitespace-nowrap">${esc(x.date)}</td>
    <td class="py-2 pe-4"><span class="text-xs bg-gray-100 rounded px-2 py-0.5 me-2">${esc(catName[x.categoryId] || "—")}</span>${esc(x.description)}</td>
    <td class="py-2 pe-4 text-gray-500">${esc(x.method)}</td>
    <td class="py-2 text-right text-red-600 whitespace-nowrap">RS ${num(x.amount).toFixed(2)}</td>
    <td class="py-2 ps-3 text-right"><button data-del="${x.id}" class="text-xs text-gray-400 hover:text-red-600">✕</button></td></tr>`).join("")
    || `<tr><td class="py-3 text-gray-500">Is mahine koi expense nahi.</td></tr>`;
}
$("month").addEventListener("change", loadList);
$("catForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  await addDoc(collection(db, "expenseCategories"), { name: $("catName").value.trim(), sort: cats.length });
  toast("Category add ho gayi"); e.target.reset(); loadCats();
});
$("expForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const amount = num($("amount").value); if (amount <= 0) return toast("Amount likhein", "error");
  await addDoc(collection(db, "expenses"), { amount, categoryId: $("category").value || null, date: $("date").value || todayISO(), method: $("method").value.trim(), description: $("desc").value.trim(), createdAt: nowTs() });
  toast("Expense save ho gaya"); $("amount").value = ""; $("desc").value = ""; loadList();
});
$("list").addEventListener("click", async (e) => {
  if (!e.target.dataset.del || !confirm("Delete?")) return;
  await deleteDoc(doc(db, "expenses", e.target.dataset.del)); toast("Expense delete ho gaya"); loadList();
});
</script>
</body>
</html>
